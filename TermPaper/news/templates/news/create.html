{% extends 'main/layout.html' %}

{% block title %}Додати новину{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">

        <h2 class="auth-title">Додати новину</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                {{ form.title }}
            </div>

            <div class="mb-3">
                {{ form.anons }}
            </div>

            <div class="mb-3">
                {{ form.full_text }}
            </div>

            <div class="mb-3">
                {{ form.date }}
            </div>

            <div class="mb-3">
                {{ form.image }}
            </div>

            {% if error %}
                <div class="auth-error">
                    {{ error }}
                </div>
            {% endif %}

            <button type="submit" class="btn btn-success w-100">
                Додати статтю
            </button>
        </form>

    </div>
</div>
{% endblock %}
